_schema-version: '3.1'
ID: porto-seguro-customer-ext
version: 1.0.0
description: Porto Seguro – Extensão de Clientes S/4HANA via SAP BTP

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci --production
        - npx cds build --production

modules:
  - name: ps-customer-ext-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 512M
      disk-quota: 512M
    requires:
      - name: ps-customer-ext-uaa
      - name: ps-customer-ext-db
      - name: ps-customer-ext-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  - name: ps-customer-ext-db-deployer
    type: hdb
    path: gen/db
    parameters:
      memory: 256M
      disk-quota: 256M

  - name: ps-customer-ext-html5-host
    type: html5-apps-repo-host
    path: app
    properties:
      content-target: true
    requires:
      - name: ps-customer-ext-uaa

  - name: ps-customer-ext-appcontent
    type: com.sap.application.content
    path: gen
    requires:
      - name: ps-customer-ext-destination
      - name: ps-customer-ext-html5-host
    build-parameters:
      no-source: true

  - name: ps-customer-ext-html5-runtime
    type: html5-apps-repo-runtime
    path: app
    requires:
      - name: ps-customer-ext-uaa
      - name: ps-customer-ext-appcontent

resources:
  - name: ps-customer-ext-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: porto-seguro-customer-ext-${org}-${space}
        tenant-mode: dedicated

  - name: ps-customer-ext-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: ps-customer-ext-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  - name: ps-customer-ext-db
    type: com.sap.xs.hana-schema
    parameters:
      service: hana
      service-plan: hdi-shared
      config:
        database_id: ~{hana-cloud-tools/DATABASE_ID}
    requires:
      - hana-cloud-tools

  - name: hana-cloud-tools
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: hana-cloud