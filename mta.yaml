_schema-version: '3.1'
ID: porto-seguro-customer-ext-backend
version: 1.0.0
description: Porto Seguro – CAP backend and HTML5 applications for SAP Build Work Zone

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci --legacy-peer-deps
        - npx cds build --production

modules:
  - name: ps-customer-ext-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 512M
      disk-quota: 512M
    requires:
      - name: ps-customer-ext-uaa
      - name: ps-customer-ext-db
      - name: ps-customer-ext-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  - name: ps-customer-ext-appcontent
    type: com.sap.application.content
    path: gen
    requires:
      - name: ps-customer-ext-destination
      - name: ps-customer-ext-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: app/
      requires:
        - name: ps-customer-ext-clientes
          artifacts:
            - clientes.zip
          target-path: app/
        - name: ps-customer-ext-dashboard
          artifacts:
            - dashboard.zip
          target-path: app/

  - name: ps-customer-ext-clientes
    type: html5
    path: app/clientes
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci --legacy-peer-deps
        - npm run build
      supported-platforms: []

  - name: ps-customer-ext-dashboard
    type: html5
    path: app/dashboard
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci --legacy-peer-deps
        - npm run build
      supported-platforms: []

  - name: ps-customer-ext-destinationcontent
    type: com.sap.application.content
    build-parameters:
      no-source: true
    requires:
      - name: ps-customer-ext-uaa
        parameters:
          service-key:
            name: ps-customer-ext-uaa-key
      - name: ps-customer-ext-html5-repo-host
        parameters:
          service-key:
            name: ps-customer-ext-html5-repo-host-key
      - name: ps-customer-ext-destination
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: ps-customer-ext-html5-repository
              ServiceInstanceName: ps-customer-ext-html5-repo-host
              ServiceKeyName: ps-customer-ext-html5-repo-host-key
              sap.cloud.service: portoseguro.customer.service
            - Name: ps-customer-ext-uaa
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: ps-customer-ext-uaa
              ServiceKeyName: ps-customer-ext-uaa-key
              sap.cloud.service: portoseguro.customer.service

resources:
  - name: ps-customer-ext-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: porto-seguro-customer-ext-backend
        tenant-mode: dedicated

  - name: ps-customer-ext-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: ps-customer-ext-db

  - name: ps-customer-ext-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: ps-customer-ext-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: ps-customer-ext-destination
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      config:
        version: 1.0.0
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: ps-customer-ext-srv
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
