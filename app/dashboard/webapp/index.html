<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porto Seguro – Dashboard Executivo</title>
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m,sap.ui.layout,sap.viz"
    data-sap-ui-resource-roots='{"com.portoseguro.dashboard": "./"}'
    data-sap-ui-compat-version="edge"
    data-sap-ui-async="true"
    data-sap-ui-log-level="WARNING"
    data-sap-ui-frame-options="allow"
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport">
  </script>
</head>
<body class="sapUiBody" id="content">
  <div data-sap-ui-component
    data-name="com.portoseguro.dashboard"
    data-id="container"
    data-settings='{"id":"com.portoseguro.dashboard"}'>
  </div>
</body>
</html>
